<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">AgriSustain React SPA and ASP.NET Core Web API architecture</title><desc id="desc">A multi-tier client service architecture with React single page application, ASP.NET Core Web API clean architecture, external payment and email services, and Microsoft SQL Server.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.tier{font-size:15px;font-weight:700}.h{font-size:14px;font-weight:700}.m{font-size:12px}.s{font-size:11px;fill:#475569}.line{fill:none;stroke:#486581;stroke-width:2;marker-end:url(#a)}.green{fill:none;stroke:#40836a;stroke-width:2;marker-end:url(#g)}.orange{fill:none;stroke:#c05f4a;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#o)}.purple{fill:none;stroke:#7b61a8;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#p)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 9,4.5 0,9Z" fill="#486581"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 9,4.5 0,9Z" fill="#40836a"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 9,4.5 0,9Z" fill="#c05f4a"/></marker><marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 9,4.5 0,9Z" fill="#7b61a8"/></marker></defs>
<rect width="1600" height="1000" fill="white"/><text x="800" y="38" text-anchor="middle" class="title">SOFTWARE ARCHITECTURE - AGRISUSTAIN</text><text x="800" y="61" text-anchor="middle" class="m" fill="#475569">Multi-tier Client/Service and Clean Architecture - React SPA + ASP.NET Core Web API</text>
<!-- actors --> <rect x="30" y="105" width="200" height="690" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="130" y="130" text-anchor="middle" class="tier">External Actors</text>
<g font-size="12" text-anchor="middle"><circle cx="130" cy="190" r="13" fill="#fff2cc" stroke="#bf9000"/><path d="M130 203v36m-25-20h50m-25 20-22 32m22-32 22 32" fill="none" stroke="#bf9000" stroke-width="2"/><text x="130" y="292" class="m">«external user»</text><text x="130" y="309" class="m">Guest / Consumer</text><circle cx="130" cy="355" r="13" fill="#d9ead3" stroke="#548235"/><path d="M130 368v36m-25-20h50m-25 20-22 32m22-32 22 32" fill="none" stroke="#548235" stroke-width="2"/><text x="130" y="457" class="m">«external user»</text><text x="130" y="474" class="m">Farmer / Cooperative</text><circle cx="130" cy="520" r="13" fill="#d9eaf7" stroke="#3d85c6"/><path d="M130 533v36m-25-20h50m-25 20-22 32m22-32 22 32" fill="none" stroke="#3d85c6" stroke-width="2"/><text x="130" y="622" class="m">«external user»</text><text x="130" y="639" class="m">B2B Buyer</text><circle cx="130" cy="675" r="13" fill="#eadcf8" stroke="#8e7cc3"/><path d="M130 688v36m-25-20h50m-25 20-22 32m22-32 22 32" fill="none" stroke="#8e7cc3" stroke-width="2"/><text x="130" y="777" class="m">«external user»</text><text x="130" y="794" class="m">Administrator</text></g>
<!-- client --> <rect x="270" y="105" width="365" height="665" rx="8" fill="#eaf3ff" stroke="#76a7dd" stroke-width="2"/><text x="452" y="130" text-anchor="middle" class="tier">Client Tier - Browser</text><rect x="300" y="155" width="305" height="86" rx="9" fill="#dcecff" stroke="#3d85c6" stroke-width="2"/><text x="452" y="181" text-anchor="middle" class="m">«client subsystem»</text><text x="452" y="204" text-anchor="middle" class="h">React 19 Single Page Application</text><text x="452" y="224" text-anchor="middle" class="m">Tailwind CSS</text>
<g><rect x="315" y="290" width="275" height="62" rx="7" fill="white" stroke="#76a7dd"/><text x="452" y="315" text-anchor="middle" class="h">«component» UI / Routing</text><text x="452" y="335" text-anchor="middle" class="s">Pages, layouts, role-specific screens</text><rect x="315" y="395" width="275" height="62" rx="7" fill="white" stroke="#76a7dd"/><text x="452" y="420" text-anchor="middle" class="h">«component» API Client</text><text x="452" y="440" text-anchor="middle" class="s">HTTPS, REST JSON, response handling</text><rect x="315" y="500" width="275" height="62" rx="7" fill="white" stroke="#76a7dd"/><text x="452" y="525" text-anchor="middle" class="h">«component» Session &amp; Access UI</text><text x="452" y="545" text-anchor="middle" class="s">Bearer token, navigation by role</text></g><text x="452" y="665" text-anchor="middle" class="s">Public: marketplace and traceability</text><text x="452" y="682" text-anchor="middle" class="s">Protected: account, ordering, farmer, buyer, admin</text>
<!-- server --> <rect x="680" y="105" width="555" height="665" rx="8" fill="#f6fbf8" stroke="#7cb896" stroke-width="2"/><text x="957" y="130" text-anchor="middle" class="tier">Application Server Tier</text><rect x="710" y="155" width="495" height="68" rx="9" fill="#d9ead3" stroke="#548235" stroke-width="2"/><text x="957" y="182" text-anchor="middle" class="m">«service subsystem»</text><text x="957" y="205" text-anchor="middle" class="h">ASP.NET Core 8 Web API</text>
<rect x="725" y="260" width="465" height="86" rx="8" fill="#fff4d6" stroke="#d7a63b"/><text x="957" y="284" text-anchor="middle" class="h">Presentation / API boundary</text><text x="957" y="305" text-anchor="middle" class="m">Controllers · DTOs · validation · JWT authentication · role/policy authorization</text><text x="957" y="326" text-anchor="middle" class="s">Provides: IAuthApi, ICatalogApi, IOrderApi, ITraceabilityApi, IAdminApi</text>
<rect x="725" y="385" width="465" height="92" rx="8" fill="#e8f7ed" stroke="#55a878"/><text x="957" y="410" text-anchor="middle" class="h">Application Core - use cases</text><text x="957" y="431" text-anchor="middle" class="m">Accounts · Marketplace · Orders/Payment · QR Traceability · B2B Contracts · Administration · Notifications</text><text x="957" y="452" text-anchor="middle" class="s">Requires: IOrderRepository, IPaymentGateway, IEmailSender, IUnitOfWork</text>
<rect x="725" y="515" width="465" height="86" rx="8" fill="#f0ecfa" stroke="#8a71b6"/><text x="957" y="540" text-anchor="middle" class="h">Domain Core - business rules and entities</text><text x="957" y="561" text-anchor="middle" class="m">Accounts · Products · Batches · Farming Logs · Orders · Transactions · Contracts · Notifications</text><text x="957" y="582" text-anchor="middle" class="s">Reservation · order/payment state · QR uniqueness · audit rules</text>
<rect x="725" y="640" width="465" height="82" rx="8" fill="#e9f0ff" stroke="#698ed0"/><text x="957" y="665" text-anchor="middle" class="h">Infrastructure adapters</text><text x="957" y="686" text-anchor="middle" class="m">EF Core / Repository · PayOS/VietQR adapter · Gmail adapter · logging/audit</text><text x="957" y="707" text-anchor="middle" class="s">Implements application-required interfaces</text><rect x="770" y="735" width="375" height="28" rx="6" fill="#fce4d6" stroke="#c65911"/><text x="957" y="754" text-anchor="middle" class="m">«component» Hosted Background Workers: expiry, reconciliation, retry</text>
<!-- external --> <rect x="1280" y="105" width="290" height="665" rx="8" fill="#fffafa" stroke="#bd9d9a" stroke-width="2"/><text x="1425" y="130" text-anchor="middle" class="tier">External Systems and Data Tier</text><rect x="1310" y="175" width="230" height="95" rx="9" fill="#fff0dc" stroke="#d4863b"/><text x="1425" y="201" text-anchor="middle" class="m">«external system»</text><text x="1425" y="223" text-anchor="middle" class="h">PayOS / VietQR</text><text x="1425" y="244" text-anchor="middle" class="m">QR payment and transaction status</text><rect x="1310" y="395" width="230" height="95" rx="9" fill="#edf6ff" stroke="#6699cc"/><text x="1425" y="421" text-anchor="middle" class="m">«external system»</text><text x="1425" y="443" text-anchor="middle" class="h">Google Gmail API</text><text x="1425" y="464" text-anchor="middle" class="m">OTP and operational email</text><ellipse cx="1425" cy="640" rx="115" ry="17" fill="#fff0c1" stroke="#d7a63b"/><rect x="1310" y="640" width="230" height="62" fill="#fff0c1" stroke="#d7a63b"/><ellipse cx="1425" cy="702" rx="115" ry="17" fill="#fff0c1" stroke="#d7a63b"/><text x="1425" y="660" text-anchor="middle" class="m">«database»</text><text x="1425" y="682" text-anchor="middle" class="h">Microsoft SQL Server</text>
<!-- lines --> <path class="line" d="M180 240H300"/><text x="240" y="231" text-anchor="middle" class="s">browser access</text><path class="line" d="M180 405H260V240H300"/><path class="line" d="M180 570H250V240H300"/><path class="line" d="M180 725H240V240H300"/><path class="line" d="M590 426H650V303H725"/><text x="657" y="295" class="s">HTTPS / REST JSON / Bearer JWT</text><path class="line" d="M957 346V385"/><text x="972" y="371" class="s">validated command/query</text><path class="line" d="M957 477V515"/><text x="972" y="501" class="s">enforces rules</text><path class="line" d="M1190 681H1260V671H1310"/><text x="1245" y="660" class="s">EF Core / SQL</text><path class="green" d="M1190 675H1250V223H1310"/><text x="1212" y="212" class="s">CreatePayment / QueryStatus</text><path class="orange" d="M1310 250H1260V303H1190"/><text x="1212" y="291" class="s">Payment IPN webhook</text><path class="green" d="M1190 697H1250V442H1310"/><text x="1213" y="429" class="s">SendEmail</text><path class="purple" d="M957 735V722"/><text x="972" y="729" class="s">scheduled operations</text>
<text x="800" y="930" text-anchor="middle" class="s">Scope note: native mobile apps, IoT sensors, blockchain and dedicated logistics/GPS integration are excluded from the current capstone scope.</text>
