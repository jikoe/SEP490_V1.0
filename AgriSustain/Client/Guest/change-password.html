<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu - AgriSustain</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/account.css">
</head>
<body class="password-body">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="workspace">
      <header id="app-header"></header>
      <main class="password-page">
        <section class="panel padded password-panel">
          <h1>Đổi mật khẩu</h1>
          <p class="muted">Tài khoản: <strong id="password-account"></strong></p>
          <div id="password-notice" class="notice" role="status" hidden></div>
          <form id="password-form" novalidate>
            <fieldset id="password-fields">
              <label class="field" for="currentPassword">Mật khẩu hiện tại <span>*</span></label>
              <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required maxlength="500" aria-describedby="currentPassword-error">
              <p id="currentPassword-error" class="password-error" role="alert"></p>
              <label class="field" for="newPassword">Mật khẩu mới <span>*</span></label>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required maxlength="500" aria-describedby="newPassword-error password-policy">
              <p id="newPassword-error" class="password-error" role="alert"></p>
              <label class="field" for="confirmPassword">Xác nhận mật khẩu mới <span>*</span></label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required maxlength="500" aria-describedby="confirmPassword-error">
              <p id="confirmPassword-error" class="password-error" role="alert"></p>
              <label class="password-reveal"><input id="password-reveal" type="checkbox"> Hiện mật khẩu</label>
              <p id="password-policy" class="muted">Mật khẩu mới cần ít nhất 8 ký tự, gồm chữ hoa, chữ thường và chữ số.</p>
              <div class="modal-actions">
                <a id="password-back" class="btn" href="../RetailCustomer/index.html">Hủy</a>
                <button id="password-submit" class="primary" type="submit">Đổi mật khẩu</button>
              </div>
            </fieldset>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script type="module" src="../js/change-password.js"></script>
</body>
</html>
