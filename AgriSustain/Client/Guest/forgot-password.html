<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - Nông Sản Việt</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="login-page">
  <main class="login-main">
    <section class="login-card">
      <h1>Quên mật khẩu</h1>
      <p id="forgot-subtitle" class="login-subtitle">
        Nhập email đã đăng ký để nhận mã xác thực
      </p>

      <div id="forgot-error" class="notice error" style="display: none;" role="alert"></div>
      <div id="forgot-notice" class="notice" style="display: none;" role="status"></div>

      <!-- Step 1: Nhập email -->
      <form id="step-1-form" class="login-form" onsubmit="handleSendCode(event)">
        <label class="field">
          <span>Email đã đăng ký *</span>
          <input
            id="forgot-email"
            type="email"
            autocomplete="email"
            autofocus
            required
            maxlength="255"
            placeholder="ten@example.com"
          />
        </label>
        <button class="primary login-submit" type="submit" id="btn-send-code">
          Gửi mã xác thực
        </button>
      </form>

      <!-- Step 2: Nhập mã OTP -->
      <form id="step-2-form" class="login-form" style="display: none;" onsubmit="handleVerifyCode(event)">
        <label class="field">
          <span>Mã xác thực OTP *</span>
          <input
            id="forgot-otp"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
            maxlength="6"
            placeholder="______"
            oninput="this.value = this.value.replace(/\D/g, '')"
          />
        </label>
        <button class="primary login-submit" type="submit" id="btn-verify-code">
          Xác thực
        </button>
        <button type="button" id="btn-resend-forgot-code" class="login-demo" onclick="handleResendCode()">
          Gửi lại mã
        </button>
      </form>

      <!-- Step 3: Đặt mật khẩu mới -->
      <form id="step-3-form" class="login-form" style="display: none;" onsubmit="handleResetPassword(event)">
        <label class="field">
          <span>Email đã xác thực</span>
          <input id="verified-email" readonly style="background: #f4f6f4;" />
        </label>

        <label class="field">
          <span>Mật khẩu mới *</span>
          <span class="password-control">
            <input
              id="new-password"
              type="password"
              autocomplete="new-password"
              required
              maxlength="128"
            />
            <button
              type="button"
              class="password-toggle"
              aria-label="Hiện mật khẩu"
              onclick="toggleFieldVisibility('new-password', this)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6Z" />
                <circle cx="12" cy="12" r="2.5" />
              </svg>
            </button>
          </span>
        </label>

        <label class="field">
          <span>Xác nhận mật khẩu mới *</span>
          <span class="password-control">
            <input
              id="confirm-new-password"
              type="password"
              autocomplete="new-password"
              required
              maxlength="128"
            />
            <button
              type="button"
              class="password-toggle"
              aria-label="Hiện mật khẩu"
              onclick="toggleFieldVisibility('confirm-new-password', this)"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6Z" />
                <circle cx="12" cy="12" r="2.5" />
              </svg>
            </button>
          </span>
        </label>

        <p class="muted" style="font-size: 12px; margin-top: -4px;">
          Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và chữ số.
        </p>

        <button class="primary login-submit" type="submit" id="btn-reset-pwd">
          Đặt lại mật khẩu
        </button>
      </form>

      <div style="margin-top: 15px; text-align: center; font-size: 14px;">
        <a href="login.html" style="color: #2e7d32; font-weight: 600; text-decoration: none;">
          ← Quay lại đăng nhập
        </a>
      </div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../messages/index.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>

  <script>
    let step = 1;
    let registeredEmail = '';
    let grantToken = null;
    let resendIn = 0;
    let resendTimer = null;

    function setSubtitle(text) {
      document.getElementById('forgot-subtitle').textContent = text;
    }

    function showError(msg) {
      const errEl = document.getElementById('forgot-error');
      if (msg) {
        errEl.textContent = msg;
        errEl.style.display = 'block';
      } else {
        errEl.style.display = 'none';
      }
    }

    function showNotice(msg) {
      const noticeEl = document.getElementById('forgot-notice');
      if (msg) {
        noticeEl.textContent = msg;
        noticeEl.style.display = 'block';
      } else {
        noticeEl.style.display = 'none';
      }
    }

    function toggleFieldVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      btn.setAttribute('aria-label', isPwd ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    }

    function startCooldown(seconds) {
      resendIn = seconds;
      const btn = document.getElementById('btn-resend-forgot-code');
      if (resendTimer) clearInterval(resendTimer);

      updateResendButton();
      resendTimer = setInterval(() => {
        resendIn--;
        updateResendButton();
        if (resendIn <= 0) clearInterval(resendTimer);
      }, 1000);
    }

    function updateResendButton() {
      const btn = document.getElementById('btn-resend-forgot-code');
      if (!btn) return;
      if (resendIn > 0) {
        btn.disabled = true;
        btn.textContent = `Gửi lại mã sau ${resendIn}s`;
      } else {
        btn.disabled = false;
        btn.textContent = 'Gửi lại mã';
      }
    }

    async function handleSendCode(e) {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      registeredEmail = email;
      showError('');
      showNotice('');

      const btn = document.getElementById('btn-send-code');
      btn.disabled = true;
      btn.textContent = 'Đang gửi mã…';

      try {
        const res = await API.forgotPassword({ email });
        if (res.success) {
          step = 2;
          document.getElementById('step-1-form').style.display = 'none';
          document.getElementById('step-2-form').style.display = '';
          setSubtitle(`Nhập mã 6 chữ số đã gửi tới ${email}`);
          showNotice(typeof res.data === 'string' ? res.data : `Mã xác thực đã được gửi tới ${email}.`);
          startCooldown(60);
          document.getElementById('forgot-otp').focus();
        } else {
          showError(res.error || 'Không thể gửi mã xác thực. Vui lòng kiểm tra lại địa chỉ email.');
        }
      } catch (err) {
        showError(err.message || 'Không thể kết nối đến máy chủ.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Gửi mã xác thực';
      }
    }

    async function handleResendCode() {
      if (resendIn > 0) return;
      showError('');
      showNotice('');

      try {
        const res = await API.resendForgotPasswordOtp({ email: registeredEmail });
        if (res.success) {
          showNotice(typeof res.data === 'string' ? res.data : 'Mã xác thực mới đã được gửi tới email của bạn.');
          document.getElementById('forgot-otp').value = '';
          startCooldown(60);
        } else {
          showError(res.error || Messages.common.resendOtpFailed);
        }
      } catch (err) {
        showError(err.message || Messages.common.resendOtpFailed);
      }
    }

    async function handleVerifyCode(e) {
      e.preventDefault();
      const otpCode = document.getElementById('forgot-otp').value.trim();
      if (!/^\d{6}$/.test(otpCode)) {
        showError(Messages.common.otpInputLength);
        return;
      }

      showError('');
      showNotice('');
      const btn = document.getElementById('btn-verify-code');
      btn.disabled = true;
      btn.textContent = 'Đang xác thực…';

      try {
        const res = await API.verifyForgotPasswordOtp({ email: registeredEmail, otpCode });
        if (res.success && res.data) {
          grantToken = res.data.resetToken;
          step = 3;
          document.getElementById('step-2-form').style.display = 'none';
          document.getElementById('step-3-form').style.display = '';
          document.getElementById('verified-email').value = res.data.email || registeredEmail;
          setSubtitle('Tạo mật khẩu mới cho tài khoản của bạn');
          document.getElementById('new-password').focus();
        } else {
          showError(res.error || Messages.common.otpInvalidOrExpired);
        }
      } catch (err) {
        showError(err.message || Messages.common.verifyOtpFailed);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Xác thực';
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-new-password').value;

      if (newPassword !== confirmPassword) {
        showError(Messages.common.passwordMismatch);
        return;
      }

      showError('');
      showNotice('');
      const btn = document.getElementById('btn-reset-pwd');
      btn.disabled = true;
      btn.textContent = 'Đang lưu…';

      try {
        const res = await API.resetPassword({
          email: registeredEmail,
          resetToken: grantToken,
          newPassword,
          confirmPassword
        });

        if (res.success) {
          step = 4;
          document.getElementById('step-3-form').style.display = 'none';
          setSubtitle('Hoàn tất');
          showNotice((res.data && res.data.message) || Messages.common.resetPasswordSuccess);
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          // MSG-OTP-05: the verified reset session expired, so the email must be verified again.
          if (res.code === 'RESET_SESSION_INVALID' || res.status === 401) {
            showError(Messages.common.resetSessionExpired);
            step = 1;
            document.getElementById('step-3-form').style.display = 'none';
            document.getElementById('step-1-form').style.display = '';
            setSubtitle('Nhập email đã đăng ký để nhận mã xác thực');
          } else {
            showError(res.error || 'Không thể đặt lại mật khẩu. Vui lòng kiểm tra lại độ mạnh mật khẩu.');
          }
        }
      } catch (err) {
        showError(err.message || Messages.common.operationFailed);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Đặt lại mật khẩu';
      }
    }
  </script>
</body>
</html>
