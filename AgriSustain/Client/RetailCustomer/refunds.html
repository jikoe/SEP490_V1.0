<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoàn tiền của tôi - AgriSustain</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/account.css">
  <style>.err { color: #b3261e; font-size: 12px; }</style>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar" style="display:none;"></aside>
    <div class="workspace no-sidebar">
      <header id="app-header"></header>
      <main>
        <div class="acc-page">
          <div class="acc-crumb" id="crumb">Trang chủ / Tài khoản nhận hoàn tiền</div>
          <h1 class="acc-title">Tài khoản nhận hoàn tiền</h1>
          <p class="acc-sub">Xác nhận tài khoản ngân hàng để AgriSustain chuyển khoản số tiền đã được duyệt hoàn cho bạn.</p>
          <div id="refund-notice" class="notice error" style="display:none;"></div>
          <div id="refund-list"></div>
          <div id="refund-detail"></div>
        </div>

        <dialog id="otp-dialog" style="width:440px;">
          <h2 style="font-size:18px; margin:0 0 6px;">Xác nhận lưu tài khoản mặc định</h2>
          <p class="acc-desc" id="otp-info" style="margin:0;"></p>
          <div class="otp-boxes"><input class="otp-digit" inputmode="numeric" maxlength="1"><input class="otp-digit" inputmode="numeric" maxlength="1"><input class="otp-digit" inputmode="numeric" maxlength="1"><input class="otp-digit" inputmode="numeric" maxlength="1"><input class="otp-digit" inputmode="numeric" maxlength="1"><input class="otp-digit" inputmode="numeric" maxlength="1"></div>
          <div style="text-align:center;"><small class="acc-err" id="otp-error"></small></div>
          <div class="acc-footer">
            <button type="button" class="acc-btn" onclick="document.getElementById('otp-dialog').close()">Hủy</button>
            <button type="button" class="acc-btn primary" id="otp-confirm">Xác nhận</button>
          </div>
        </dialog>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script>
    /*
     * UC-FIN-08 Provide Refund Account (RetailCustomer, WholesaleBuyer), layout of Figma page UC-FIN-08:
     * (1) refund information, (2) choose account, (3) bank, (4) number + Kiểm tra, (5) holder,
     * (6) save as default, (7) Hủy / Xác nhận tài khoản, (9) account history.
     */
    const STATE = {
      AwaitingAccount: ['Chờ cung cấp tài khoản', '#fbf3dc', '#8b6b26'],
      ReadyForTransfer: ['Chờ chuyển khoản', '#e6f0fa', '#2c5a8a'],
      TransferFailed: ['Chuyển khoản thất bại', '#fdeeec', '#a33b2c'],
      Transferring: ['Đang chuyển khoản', '#eef0fb', '#3b4a9a'],
      Completed: ['Đã hoàn tiền', '#e6efe5', '#1e5a3c']
    };
    const NOT_FOUND = 'Không tìm thấy tài khoản này tại ngân hàng đã chọn. Vui lòng kiểm tra lại ngân hàng và số tài khoản.';
    const esc = (v) => Utils.escapeHtml(v == null ? '' : String(v));
    const time = (v) => v ? Utils.formatDateTime(/[zZ]|[+-]\d\d:\d\d$/.test(String(v)) ? v : `${v}Z`) : '—';
    const badge = (s) => { const x = STATE[s] || [s, '#eef3ef', '#4d695a']; return `<span style="background:${x[1]}; color:${x[2]}; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:600;">${esc(x[0])}</span>`; };
    let detail = null;
    let lookup = { status: 'idle', holder: '' };
    let lookupTimer = null;
    let lookupSeq = 0;

    async function loadList() {
      const res = await API.request('/profile/refunds', { suppressErrorToast: true });
      const box = document.getElementById('refund-list');
      if (!res.success) { box.innerHTML = `<div class="notice error">${esc(res.error)}</div>`; return; }
      const items = res.data || [];
      if (!items.length) { box.innerHTML = '<div class="acc-card"><p class="muted" style="margin:0;">Bạn chưa có yêu cầu hoàn tiền nào.</p></div>'; return; }
      box.innerHTML = `<div class="acc-card" style="padding:0; overflow:hidden;"><div class="table-wrap" style="min-height:0;"><table style="min-width:0;">
        <thead><tr><th>Mã hoàn tiền</th><th>Đơn hàng</th><th>Số tiền</th><th>Trạng thái</th><th>Tài khoản nhận</th><th></th></tr></thead><tbody>
        ${items.map((r) => `<tr><td><strong>${esc(r.refundCode)}</strong></td><td>${esc(r.orderCode || '—')}</td><td>${Utils.formatVND(r.amount)}</td>
          <td>${badge(r.accountState)}</td><td>${esc(r.maskedAccount || '—')}</td>
          <td><button type="button" class="acc-btn ${r.accountState === 'AwaitingAccount' || r.accountState === 'TransferFailed' ? 'primary' : ''}" onclick="openDetail(${Number(r.refundId)})">
            ${r.accountState === 'AwaitingAccount' ? 'Cung cấp tài khoản' : r.accountState === 'TransferFailed' ? 'Sửa tài khoản' : 'Xem'}</button></td></tr>`).join('')}
        </tbody></table></div></div>`;
    }

    async function openDetail(id) {
      const res = await API.request(`/profile/refunds/${id}`, { suppressErrorToast: true });
      if (!res.success) { Utils.showToast(res.error, 'error'); return; }
      detail = res.data;
      lookup = { status: 'idle', holder: '' };
      history.replaceState(null, '', `?id=${id}`);
      document.getElementById('refund-list').style.display = 'none';
      document.getElementById('crumb').textContent = `Trang chủ / Đơn hàng của tôi / ${detail.orderCode || detail.refundCode} / Tài khoản nhận hoàn tiền`;
      renderDetail();
    }

    function backToList() {
      detail = null;
      document.getElementById('refund-detail').innerHTML = '';
      document.getElementById('refund-list').style.display = '';
      document.getElementById('crumb').textContent = 'Trang chủ / Tài khoản nhận hoàn tiền';
      history.replaceState(null, '', window.location.pathname);
    }

    const row = (k, v) => `<div style="display:flex; justify-content:space-between; gap:12px; font-size:13px; margin:12px 0;"><span class="acc-hint" style="font-size:13px;">${k}</span><strong style="text-align:right;">${v}</strong></div>`;
    const accountCard = (label, a, checked, value) => `
      <label style="display:flex; align-items:center; gap:14px; border:1px solid ${checked ? '#255c3e' : '#e3e8e2'}; background:${checked ? '#f3f8f2' : '#fff'}; border-radius:12px; padding:16px; margin-bottom:12px; cursor:${value ? 'pointer' : 'default'};">
        ${value ? `<input type="radio" name="mode" value="${value}" ${checked ? 'checked' : ''}>` : ''}
        <span class="bank-icon" style="background:#e6efe5;">🏛</span>
        <div><div class="acc-hint">${label}</div><strong>${esc(a.bankShortName)} ${esc(a.maskedAccountNumber)}</strong><div class="bank-holder" style="margin:0;">${esc(a.accountHolder)}</div></div>
      </label>`;

    function renderDetail() {
      const d = detail;
      const failed = d.accountState === 'TransferFailed';
      const hasDefault = Boolean(d.defaultAccount);
      const left = `
        <div class="acc-card">
          <h2>Thông tin hoàn tiền</h2>
          <div style="margin:12px 0 14px;">${badge(d.accountState)}</div>
          <div style="border-top:1px solid #e3e8e2;">
            ${row('Đơn hàng', esc(d.orderCode || '—'))}${row('Mã hoàn tiền', esc(d.refundCode))}
            ${d.farmName ? row('Nông trại', esc(d.farmName)) : ''}${d.approvedAt ? row('Ngày duyệt', esc(time(d.approvedAt))) : ''}
          </div>
          <div style="border-top:1px solid #e3e8e2; display:flex; justify-content:space-between; align-items:center; padding-top:12px;">
            <span class="acc-hint" style="font-size:13px;">Số tiền hoàn</span><strong style="font-size:20px;">${Utils.formatVND(d.amount)}</strong></div>
          ${d.reason ? `<p class="acc-note">Lý do: ${esc(d.reason)}</p>` : ''}
          <p class="acc-note">Nội dung chuyển khoản sẽ là mã hoàn tiền ${esc(d.refundCode)}.</p>
        </div>`;

      let right;
      if (!d.canEdit) {
        right = `
          <div class="acc-warn">⚠ Khoản hoàn này đang ở trạng thái ${esc((STATE[d.accountState] || [d.accountState])[0])}. Tài khoản nhận không thể thay đổi nữa.</div>
          <h2>Tài khoản nhận tiền đã xác nhận</h2>
          <div style="margin-top:12px;">${d.receiver ? accountCard(`Đã xác nhận lúc ${esc(time(d.receiver.providedAt))}`, d.receiver, true) : '<p class="muted">—</p>'}</div>
          ${historyHtml(d)}
          <div class="acc-footer"><button type="button" class="acc-btn" onclick="backToList()">Quay lại danh sách</button></div>`;
      } else {
        const banks = (d.banks || []).map((b) => `<option value="${esc(b.bankCode)}">${esc(b.shortName)} – ${esc(b.fullName)}</option>`).join('');
        right = `
          ${failed ? `<div style="background:#fdeeec; border:1px solid #f3c9c2; color:#a33b2c; border-radius:10px; padding:12px 14px; font-size:12px; margin-bottom:16px;">
            ⚠ Chuyển khoản${d.receiver ? ` tới ${esc(d.receiver.bankShortName)} ${esc(d.receiver.maskedAccountNumber)}` : ''} thất bại${d.lastFailureReason ? `: ${esc(d.lastFailureReason)}` : ''}. Vui lòng kiểm tra và xác nhận lại tài khoản.</div>` : ''}
          <h2>${failed ? 'Tài khoản nhận tiền' : 'Chọn tài khoản nhận tiền'}</h2>
          <p class="acc-desc">Tài khoản mặc định được điền sẵn từ mục Tài khoản ngân hàng trong hồ sơ của bạn.</p>
          ${failed && d.receiver ? accountCard('Tài khoản đã dùng (thất bại)', d.receiver, false) : ''}
          ${hasDefault ? accountCard('Tài khoản mặc định', d.defaultAccount, true, 'default') : ''}
          <label style="display:flex; align-items:center; gap:14px; border:1px solid #e3e8e2; border-radius:12px; padding:16px; cursor:pointer;">
            <input type="radio" name="mode" value="other" ${hasDefault ? '' : 'checked'}>
            <div><strong>Dùng tài khoản khác</strong><div class="acc-hint">Nhập ngân hàng, số tài khoản và tên chủ tài khoản</div></div>
          </label>
          <form id="account-form" novalidate style="margin-top:16px;">
            <div id="other-fields" style="display:${hasDefault ? 'none' : 'block'};">
              <label class="field"><span>Ngân hàng *</span><select id="f-bank"><option value="">-- Chọn ngân hàng --</option>${banks}</select><small class="acc-err" data-error="bankCode"></small></label>
              <label class="field"><span>Số tài khoản *</span>
                <div class="acc-input-row"><input id="f-number" inputmode="numeric" maxlength="19" placeholder="6–19 chữ số"><button type="button" class="acc-btn" id="f-check">Kiểm tra</button></div>
                <small class="acc-err" data-error="accountNumber"></small></label>
              <label class="field"><span>Tên chủ tài khoản (tự điền)</span><div id="holder-box"></div><small class="acc-err" data-error="accountHolder"></small></label>
              <label style="display:flex; gap:8px; align-items:center; font-size:13px; margin-bottom:8px;"><input type="checkbox" id="f-save"> Lưu làm tài khoản ngân hàng mặc định</label>
              <div class="acc-info" id="otp-note" style="display:none;">✉ Vì bạn chọn lưu làm tài khoản mặc định, mã OTP sẽ được gửi tới email đăng ký khi bấm Xác nhận.</div>
            </div>
            <small class="acc-err" data-error="confirmRecipient"></small>
            <div class="acc-info" style="margin-top:12px;">ⓘ Sau khi xác nhận, Bộ phận tài chính sẽ chuyển khoản trong giờ làm việc. Bạn có thể đổi tài khoản khi yêu cầu còn ở trạng thái Chờ chuyển hoặc Thất bại.</div>
            <div class="acc-footer">
              <button type="button" class="acc-btn" onclick="backToList()">Hủy</button>
              <button type="submit" class="acc-btn primary" id="f-submit">Xác nhận tài khoản</button>
            </div>
          </form>
          ${historyHtml(d)}`;
      }
      document.getElementById('refund-detail').innerHTML = `
        <div style="display:grid; grid-template-columns:360px 1fr; gap:24px; align-items:start;">${left}<div class="acc-card">${right}</div></div>`;
      if (d.canEdit) bindForm();
    }

    function historyHtml(d) {
      if (!(d.history || []).length) return '';
      return `<h2 style="margin-top:26px;">Lịch sử tài khoản nhận</h2>
        ${d.history.map((h) => `<div style="display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid #eef1ec;">
          <div><div style="font-size:13px;">${esc(h.action)}${h.detail ? ` – ${esc(h.detail)}` : ''}</div><div class="acc-hint">${esc(h.actor)}</div></div>
          <span class="acc-hint">${esc(time(h.occurredAt))}</span></div>`).join('')}`;
    }

    const mode = () => document.querySelector('input[name="mode"]:checked')?.value || 'other';
    function setErrors(map) { document.querySelectorAll('[data-error]').forEach((el) => { el.textContent = map[el.dataset.error] || ''; }); }

    function bindForm() {
      document.querySelectorAll('input[name="mode"]').forEach((r) => { r.onchange = () => {
        document.getElementById('other-fields').style.display = mode() === 'other' ? 'block' : 'none';
      }; });
      document.getElementById('f-bank').onchange = () => scheduleLookup();
      document.getElementById('f-number').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, ''); scheduleLookup(); };
      document.getElementById('f-check').onclick = () => scheduleLookup(0);
      document.getElementById('f-save').onchange = (e) => { document.getElementById('otp-note').style.display = e.target.checked ? 'block' : 'none'; };
      document.getElementById('account-form').onsubmit = submit;
      renderHolder();
    }

    function renderHolder() {
      const box = document.getElementById('holder-box');
      document.querySelector('[data-error="accountNumber"]').textContent = lookup.status === 'NotFound' ? NOT_FOUND : '';
      box.innerHTML = lookup.status === 'Found'
        ? `<div class="acc-holder">${esc(lookup.holder)}<span>✓ Đã xác minh với ngân hàng</span></div>`
        : lookup.status === 'Unavailable'
          ? '<input id="f-holder" maxlength="100" placeholder="Hiện không tra cứu được ngân hàng, vui lòng nhập tên chủ tài khoản">'
          : `<input readonly placeholder="${lookup.status === 'checking' ? 'Đang tra cứu tài khoản tại ngân hàng…' : 'Tự điền sau khi kiểm tra số tài khoản'}">
             <small class="acc-hint">Tên chủ tài khoản do ngân hàng trả về, không nhập tay.</small>`;
    }

    // Step 4: look the account up about 600 ms after typing stops, or at once with "Kiểm tra" (BR-BA-06).
    function scheduleLookup(delay = 600) {
      clearTimeout(lookupTimer);
      const bankCode = document.getElementById('f-bank').value;
      const accountNumber = document.getElementById('f-number').value;
      const seq = ++lookupSeq;
      if (!bankCode || !/^\d{6,19}$/.test(accountNumber)) { lookup = { status: 'idle', holder: '' }; renderHolder(); return; }
      lookup = { status: 'checking', holder: '' };
      renderHolder();
      lookupTimer = setTimeout(async () => {
        const res = await API.request('/profile/bank-account/lookup', { method: 'POST', body: { bankCode, accountNumber }, suppressErrorToast: true });
        if (seq !== lookupSeq) return;
        lookup = res.success ? { status: res.data.status, holder: res.data.accountHolder || '' } : { status: 'error', holder: '' };
        renderHolder();
      }, delay);
    }

    function buildBody(otpCode) {
      const useDefault = mode() === 'default';
      return {
        useDefaultAccount: useDefault,
        bankCode: useDefault ? null : document.getElementById('f-bank').value,
        accountNumber: useDefault ? null : document.getElementById('f-number').value,
        accountHolder: !useDefault && lookup.status === 'Unavailable' ? (document.getElementById('f-holder')?.value.trim() || null) : null,
        // Pressing "Xác nhận tài khoản" is the recipient confirmation of Step 4 (Figma has no separate tick box).
        confirmRecipient: true,
        saveAsDefault: !useDefault && document.getElementById('f-save').checked,
        otpCode: otpCode || null
      };
    }

    async function submit(event) {
      event.preventDefault();
      const body = buildBody();
      const e = {};
      if (!body.useDefaultAccount) {
        if (!body.bankCode) e.bankCode = 'Trường này là bắt buộc.';
        if (!/^\d{6,19}$/.test(body.accountNumber || '')) e.accountNumber = 'Vui lòng sửa Số tài khoản: chỉ gồm chữ số, 6–19 ký tự.';
        else if (lookup.status === 'NotFound') e.accountNumber = NOT_FOUND;
        else if (lookup.status !== 'Found' && lookup.status !== 'Unavailable') e.accountNumber = 'Vui lòng bấm Kiểm tra để xác minh số tài khoản.';
        if (lookup.status === 'Unavailable' && !body.accountHolder) e.accountHolder = 'Trường này là bắt buộc.';
      }
      setErrors(e);
      if (Object.keys(e).length) return;
      if (body.saveAsDefault) { await sendOtp(); return; }
      await save(body);
    }

    async function sendOtp() {
      const res = await API.request('/profile/refunds/otp', { method: 'POST', suppressErrorToast: true });
      if (!res.success) { Utils.showToast(res.error, 'error'); return; }
      document.getElementById('otp-info').textContent = res.data?.message || 'Mã OTP 6 số đã được gửi tới email của bạn.';
      document.querySelectorAll('.otp-digit').forEach((b) => { b.value = ''; });
      document.getElementById('otp-error').textContent = '';
      document.getElementById('otp-dialog').showModal();
      document.querySelector('.otp-digit').focus();
    }

    async function save(body) {
      const btn = document.getElementById('f-submit');
      btn.disabled = true; btn.textContent = 'Đang lưu…';
      const res = await API.request(`/profile/refunds/${detail.refundId}/account`, { method: 'PUT', body, suppressErrorToast: true });
      btn.disabled = false; btn.textContent = 'Xác nhận tài khoản';
      if (!res.success) {
        const fields = (res.data && res.data.errors) || {};
        if (fields.otpCode) { document.getElementById('otp-error').textContent = fields.otpCode[0]; return false; }
        setErrors(Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, Array.isArray(v) ? v[0] : v])));
        Utils.showToast(res.error, 'error');
        return true;
      }
      Utils.showToast(res.data.message, 'success');
      detail = res.data.refund;
      renderDetail();
      loadList();
      return true;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;
      const role = (Auth.getUserRole() || '').toLowerCase();
      if (!role.includes('retail') && !role.includes('wholesale')) { window.location.href = Auth.getLandingPageForRole(role); return; }
      const boxes = [...document.querySelectorAll('.otp-digit')];
      boxes.forEach((box, i) => {
        box.oninput = () => {
          const digits = box.value.replace(/\D/g, '');
          if (digits.length > 1) digits.slice(0, 6).split('').forEach((d, k) => { if (boxes[k]) boxes[k].value = d; });
          else { box.value = digits; if (digits && boxes[i + 1]) boxes[i + 1].focus(); }
        };
        box.onkeydown = (e) => { if (e.key === 'Backspace' && !box.value && boxes[i - 1]) boxes[i - 1].focus(); };
      });
      document.getElementById('otp-confirm').onclick = async () => {
        const code = boxes.map((b) => b.value).join('');
        if (!/^\d{6}$/.test(code)) { document.getElementById('otp-error').textContent = 'Mã OTP gồm 6 chữ số.'; return; }
        if (await save(buildBody(code))) document.getElementById('otp-dialog').close();
      };
      loadList();
      const id = new URLSearchParams(window.location.search).get('id');
      if (id) openDetail(Number(id));
    });
  </script>
</body>
</html>
