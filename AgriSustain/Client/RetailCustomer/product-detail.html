<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - Nông Sản Việt</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div class="marketplace">
    <!-- Header matching Frontend Marketplace.jsx -->
    <header class="mkt-header">
      <a class="mkt-brand" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 3C9 2 3 7 5 15c7 3 14-2 15-12ZM3 21 16 8M9 15l-1-5m1 5 5 1" />
        </svg>
        <span>Nông Sản Việt</span>
      </a>
      <p class="mkt-slogan">Nền tảng nông sản Việt – Kết nối nông dân, bền vững tương lai</p>

      <form class="mkt-search" role="search" onsubmit="handleSearch(event)">
        <button aria-label="Tìm kiếm" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21 21-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0" />
          </svg>
        </button>
        <input id="mkt-search-input" aria-label="Tìm kiếm sản phẩm" type="search" maxlength="150" placeholder="Tìm kiếm sản phẩm, danh mục…" autocomplete="off" spellcheck="false">
      </form>

      <a id="mkt-cart-btn" class="mkt-cart-button" href="cart.html" title="Giỏ hàng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h3l3 12h11l3-9H6M9 21h.01M19 21h.01" />
        </svg>
        <span id="mkt-cart-badge" class="mkt-cart-count" style="display:none;">0</span>
      </a>

      <div id="mkt-account-container">
        <a class="mkt-login" href="../Guest/login.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21a8 8 0 0 0-16 0M17 7a5 5 0 1 1-10 0 5 5 0 0 1 10 0" />
          </svg>
          Đăng nhập
        </a>
      </div>
    </header>

    <!-- Main Detail Screen matching ProductDetail.jsx 1:1 -->
    <main class="mkt-detail" id="mkt-detail-container">
      <div class="mkt-state" role="status" style="padding: 40px; text-align: center;">Đang tải chi tiết sản phẩm…</div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../messages/common.js"></script>
  <script src="../messages/cart.js"></script>
  <script src="../messages/index.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>

  <script>
    let currentDetail = null;
    let currentImageIndex = 0;
    let currentTab = 'information';
    let showFarmDetails = false;
    let quantity = 1;

    document.addEventListener('DOMContentLoaded', async () => {
      renderAccountSection();
      updateCartBadge();

      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id') || '1';
      await loadProductDetail(productId);
    });

    function renderAccountSection() {
      const container = document.getElementById('mkt-account-container');
      const isAuth = Auth.isAuthenticated();
      const user = Auth.getUserInfo();

      if (isAuth && user) {
        const landing = Auth.getLandingPageForRole(user.role);
        const name = Utils.escapeHtml(user.fullName || user.username || 'Khách');

        container.innerHTML = `
          <details class="mkt-account">
            <summary>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21a8 8 0 0 0-16 0M17 7a5 5 0 1 1-10 0 5 5 0 0 1 10 0" /></svg>
              <span>${name}</span>
              <span>⌄</span>
            </summary>
            <div>
              <a href="${landing}">Khu vực làm việc</a>
              <a href="orders.html">Đơn hàng của tôi</a>
              <a href="profile.html">Hồ sơ cá nhân</a>
              <button type="button" onclick="API.logout()">Đăng xuất</button>
            </div>
          </details>
        `;
      } else {
        container.innerHTML = `
          <a class="mkt-login" href="../Guest/login.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21a8 8 0 0 0-16 0M17 7a5 5 0 1 1-10 0 5 5 0 0 1 10 0" /></svg>
            Đăng nhập
          </a>
        `;
      }
    }

    async function updateCartBadge() {
      try {
        const res = await API.getCart();
        if (res.success && res.data) {
          const items = res.data.items || [];
          const totalQty = items.reduce((sum, item) => sum + (item.quantity || 1), 0);
          const badge = document.getElementById('mkt-cart-badge');
          if (badge) {
            badge.textContent = totalQty;
            badge.style.display = totalQty > 0 ? 'inline-block' : 'none';
          }
        }
      } catch (e) {}
    }

    function handleSearch(e) {
      e.preventDefault();
      const kw = document.getElementById('mkt-search-input').value.trim();
      window.location.href = `index.html?search=${encodeURIComponent(kw)}`;
    }

    async function loadProductDetail(productId) {
      const container = document.getElementById('mkt-detail-container');
      try {
        const res = await API.getMarketplaceDetail(productId);
        if (res.success && res.data) {
          currentDetail = res.data;
          renderDetailView();
        } else {
          container.innerHTML = `
            <div class="panel padded" style="text-align:center; padding:60px 20px;">
              <h2>Không tìm thấy sản phẩm.</h2>
              <p style="color:#687b70;">${res.error || 'Sản phẩm không tồn tại hoặc đã bị gỡ khỏi sàn.'}</p>
              <a href="index.html" class="primary" style="display:inline-block; margin-top:16px; padding:10px 20px; border-radius:6px; text-decoration:none;">Quay lại Trang chủ Nông sản</a>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `
          <div class="panel padded" style="text-align:center; padding:60px 20px;">
            <h2>Lỗi kết nối.</h2>
            <p style="color:#687b70;">Không thể kết nối đến máy chủ để tải thông tin sản phẩm.</p>
            <a href="index.html" class="primary" style="display:inline-block; margin-top:16px; padding:10px 20px; border-radius:6px; text-decoration:none;">Quay lại Trang chủ Nông sản</a>
          </div>
        `;
      }
    }

    function renderDetailView() {
      const container = document.getElementById('mkt-detail-container');
      const { product, images, batches, certificates, reviews, similarProducts, farmAddress, description, wholesalePrice, wholesaleMinQuantity } = currentDetail;
      const certBadge = (product.certifications && product.certifications[0]) || '';
      const rating = product.rating ? Number(product.rating).toFixed(1) : '5.0';
      const safeImages = images && images.length > 0 ? images : [{ url: '', altText: product.name }];

      container.innerHTML = `
        <!-- Breadcrumb matching Frontend -->
        <nav class="mkt-breadcrumb" aria-label="Đường dẫn">
          <a href="index.html">⌂ <span>Trang chủ</span></a><span>›</span>
          <a href="index.html">Nông sản</a><span>›</span>
          <a href="index.html?categoryId=${product.categoryId}">${Utils.escapeHtml(product.category || 'Nông sản')}</a><span>›</span>
          <span aria-current="page">${Utils.escapeHtml(product.name)}</span>
        </nav>

        <div class="mkt-detail-grid">
          <!-- Gallery Section -->
          <section class="mkt-gallery" aria-label="Ảnh sản phẩm">
            <div class="mkt-main-photo">
              <div class="mkt-image-fallback" role="img" aria-label="${Utils.escapeHtml(product.name)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 3C9 2 3 7 5 15c7 3 14-2 15-12ZM3 21 16 8M9 15l-1-5m1 5 5 1" /></svg>
                <span>Chưa có ảnh sản phẩm</span>
              </div>
              ${certBadge ? `
                <span class="mkt-cert-badge">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6Zm-5 9 4 4 6-7"/></svg>
                  ${Utils.escapeHtml(certBadge)}
                </span>
              ` : ''}
              ${safeImages.length > 1 ? `
                <button aria-label="Ảnh trước" class="mkt-photo-prev" onclick="changeImage(-1)">‹</button>
                <button aria-label="Ảnh sau" class="mkt-photo-next" onclick="changeImage(1)">›</button>
              ` : ''}
            </div>
            ${safeImages.length > 1 ? `
              <div class="mkt-thumbnails">
                ${safeImages.map((img, idx) => `
                  <button aria-label="Xem ảnh ${idx + 1}" aria-pressed="${idx === currentImageIndex}" onclick="selectImage(${idx})">
                    <div class="mkt-image-fallback" style="height: 100%;">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 3C9 2 3 7 5 15c7 3 14-2 15-12ZM3 21 16 8M9 15l-1-5m1 5 5 1" /></svg>
                    </div>
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </section>

          <!-- Product Information Section -->
          <section class="mkt-product-information">
            <a class="mkt-category-pill" href="index.html?categoryId=${product.categoryId}">
              ${Utils.escapeHtml(product.category || 'Nông sản sạch')}
            </a>
            <h1>${Utils.escapeHtml(product.name)}</h1>
            <p class="mkt-short-description">
              ${product.region ? `Nông sản ${Utils.escapeHtml(product.region)} – ` : ''}${Utils.escapeHtml(product.supplier || 'Nông hộ liên kết')}
            </p>

            <span class="mkt-rating">
              <span aria-hidden="true">★</span> <strong>${rating}</strong> <small>(${product.reviewCount || 0} đánh giá)</small>
            </span>

            <div class="mkt-detail-price">
              <span class="mkt-price">${Utils.formatVND(product.price)} <small>/ ${Utils.escapeHtml(product.unit || 'kg')}</small></span>
            </div>

            <ul class="mkt-highlights">
              <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 3C9 2 3 7 5 15c7 3 14-2 15-12ZM3 21 16 8M9 15l-1-5m1 5 5 1" /></svg>
                Nguồn gốc: ${Utils.escapeHtml(product.region || 'Chưa cập nhật')}
              </li>
              <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6Zm-5 9 4 4 6-7"/></svg>
                ${certificates && certificates.length > 0 ? `Chứng nhận: ${certificates.map(c => c.type).join(', ')}` : 'Nhà cung cấp đã xác thực'}
              </li>
              <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h6v6H3ZM15 3h6v6h-6ZM3 15h6v6H3ZM15 15h6v6h-6Z" /></svg>
                Còn ${(product.availableQuantity || 0).toLocaleString('vi-VN')} ${Utils.escapeHtml(product.unit || 'kg')} khả dụng
              </li>
              ${wholesalePrice != null && wholesaleMinQuantity != null ? `
                <li>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5h20v14H2ZM2 9h20M5 15h5"/></svg>
                  Giá sỉ: ${Utils.formatVND(wholesalePrice)} / ${Utils.escapeHtml(product.unit || 'kg')} từ ${wholesaleMinQuantity} ${Utils.escapeHtml(product.unit || 'kg')}
                </li>
              ` : ''}
            </ul>

            <!-- Add to Cart Form -->
            <form class="mkt-buy" onsubmit="handleAddToCart(event)" noValidate>
              <span class="mkt-quantity">
                <button type="button" aria-label="Giảm số lượng" onclick="changeQuantity(-1)">−</button>
                <input id="detail-qty" aria-label="Số lượng" type="number" min="1" step="1" value="${quantity}" onchange="setQuantityVal(this.value)">
                <button type="button" aria-label="Tăng số lượng" onclick="changeQuantity(1)">+</button>
              </span>
              <label class="mkt-quantity-unit" for="detail-qty">(${Utils.escapeHtml(product.unit || 'kg')})</label>
              <button type="submit" id="btn-add-cart" class="mkt-primary" ${product.availableQuantity < 1 ? 'disabled' : ''}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h3l3 12h11l3-9H6M9 21h.01M19 21h.01"/></svg>
                ${product.availableQuantity < 1 ? 'Hết hàng' : 'Thêm vào giỏ hàng'}
              </button>
            </form>

            <button class="mkt-share" type="button" onclick="handleShare()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 11 10-6M7 13l10 6M7 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0M23 4a3 3 0 1 1-6 0 3 3 0 0 1 6 0M23 20a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg>
              Chia sẻ
            </button>
            <p id="share-message" class="mkt-share-message" style="display:none;" role="status"></p>
          </section>

          <!-- Detail Sidebar -->
          <aside class="mkt-detail-sidebar">
            <section class="mkt-farm-card">
              <div class="mkt-farm-heading">
                <span class="mkt-farm-avatar">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 3C9 2 3 7 5 15c7 3 14-2 15-12ZM3 21 16 8M9 15l-1-5m1 5 5 1" /></svg>
                </span>
                <div>
                  <h2>${Utils.escapeHtml(product.supplier || 'Nông hộ')}</h2>
                  <p>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6Zm-5 9 4 4 6-7"/></svg>
                    Đã xác thực
                  </p>
                </div>
              </div>
              <button type="button" onclick="toggleFarmInfo()" id="btn-toggle-farm">
                ${showFarmDetails ? 'Ẩn thông tin gian hàng' : 'Xem gian hàng'}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
              </button>
              <div id="farm-extra-panel" class="mkt-farm-extra" style="display: ${showFarmDetails ? 'block' : 'none'};">
                <p>${Utils.escapeHtml(farmAddress || 'Đang cập nhật địa chỉ trang trại')}</p>
                <a href="index.html?supplierId=${product.supplierId || ''}">Xem sản phẩm của nhà cung cấp</a>
              </div>
            </section>

            <section class="mkt-service-card" aria-label="Thông tin mua hàng">
              <div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 4h13v13H1ZM14 9h5l4 5v3h-9M8 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0M21 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/></svg>
                <div>
                  <h2>Vận chuyển</h2>
                  <p>Phí và phạm vi giao hàng được xác nhận khi thanh toán.</p>
                </div>
              </div>
              <div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5h20v14H2ZM2 9h20M5 15h5"/></svg>
                <div>
                  <h2>Thanh toán</h2>
                  <p>Kiểm tra phương thức và tổng tiền tại bước thanh toán.</p>
                </div>
              </div>
              <div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6Zm-5 9 4 4 6-7"/></svg>
                <div>
                  <h2>Thông tin minh bạch</h2>
                  <p>Xem chứng nhận và truy xuất lô hàng bên dưới.</p>
                </div>
              </div>
            </section>
          </aside>

          <!-- Tabs Content Section -->
          <section class="mkt-detail-content">
            <div class="mkt-tabs" role="tablist" aria-label="Thông tin chi tiết">
              <button role="tab" id="tab-btn-information" aria-selected="${currentTab === 'information'}" onclick="selectTab('information')">
                Thông tin sản phẩm
              </button>
              <button role="tab" id="tab-btn-reviews" aria-selected="${currentTab === 'reviews'}" onclick="selectTab('reviews')">
                Đánh giá (${product.reviewCount || 0})
              </button>
              <button role="tab" id="tab-btn-delivery" aria-selected="${currentTab === 'delivery'}" onclick="selectTab('delivery')">
                Chính sách giao hàng
              </button>
            </div>

            <div id="product-panel" role="tabpanel" tabindex="0">
              ${renderTabContent()}
            </div>
          </section>

          <!-- Similar Products -->
          ${similarProducts && similarProducts.length > 0 ? `
            <aside class="mkt-similar">
              <div class="mkt-similar-heading">
                <h2>Sản phẩm tương tự</h2>
                <a href="index.html?categoryId=${product.categoryId}">Xem tất cả</a>
              </div>
              ${similarProducts.map(item => `
                <a class="mkt-similar-item" href="product-detail.html?id=${item.id}">
                  <div class="mkt-image-fallback" style="width: 50px; height: 50px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 3C9 2 3 7 5 15c7 3 14-2 15-12ZM3 21 16 8M9 15l-1-5m1 5 5 1" /></svg>
                  </div>
                  <div>
                    <h3>${Utils.escapeHtml(item.name)}</h3>
                    <span class="mkt-price">${Utils.formatVND(item.price)} <small>/ ${Utils.escapeHtml(item.unit || 'kg')}</small></span>
                    <span class="mkt-rating">★ ${item.rating ? Number(item.rating).toFixed(1) : '5.0'}</span>
                  </div>
                  <span>›</span>
                </a>
              `).join('')}
            </aside>
          ` : ''}
        </div>
      `;
    }

    function renderTabContent() {
      const { product, batches, certificates, reviews, description } = currentDetail;

      if (currentTab === 'information') {
        const batch0 = batches && batches[0];
        return `
          <div class="mkt-description-grid">
            <div>
              <h2>Mô tả sản phẩm</h2>
              <p class="mkt-description">${Utils.escapeHtml(description || 'Nhà cung cấp chưa cập nhật mô tả chi tiết sản phẩm.')}</p>
              ${certificates && certificates.length > 0 ? `
                <h2>Chứng nhận đã xác thực</h2>
                <ul class="mkt-certificates">
                  ${certificates.map(c => `
                    <li>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 4 4L20 5"/></svg>
                      <div>
                        <strong>${Utils.escapeHtml(c.type)}</strong> · ${Utils.escapeHtml(c.number || '')}
                        <p>${Utils.escapeHtml(c.issuedBy || '')}${c.expiryDate ? ` · Hết hạn: ${c.expiryDate}` : ''}</p>
                      </div>
                    </li>
                  `).join('')}
                </ul>
              ` : ''}
            </div>
            <section class="mkt-specifications">
              <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h6v6H3ZM15 3h6v6h-6ZM3 15h6v6H3ZM15 15h6v6h-6Z" /></svg>
                Thông số sản phẩm
              </h2>
              <dl>
                <dt>Loại sản phẩm</dt><dd>${Utils.escapeHtml(product.category || 'Nông sản')}</dd>
                <dt>Xuất xứ</dt><dd>${Utils.escapeHtml(product.region || 'Chưa cập nhật')}</dd>
                <dt>Đơn vị</dt><dd>${Utils.escapeHtml(product.unit || 'kg')}</dd>
                <dt>Tồn kho</dt><dd>${(product.availableQuantity || 0).toLocaleString('vi-VN')} ${Utils.escapeHtml(product.unit || 'kg')}</dd>
                ${batch0?.variety ? `<dt>Giống</dt><dd>${Utils.escapeHtml(batch0.variety)}</dd>` : ''}
                ${batch0?.harvestDate ? `<dt>Thu hoạch</dt><dd>${batch0.harvestDate}</dd>` : ''}
                ${batch0?.expirationDate ? `<dt>Hạn sử dụng</dt><dd>${batch0.expirationDate}</dd>` : ''}
              </dl>
            </section>
          </div>
          ${batches && batches.length > 0 ? `
            <section class="mkt-batches">
              <h2>Lô hàng & truy xuất nguồn gốc</h2>
              ${batches.map(b => `
                <article>
                  <div>
                    <h3>${Utils.escapeHtml(b.code)}</h3>
                    <p>${Utils.escapeHtml(b.season || '')} · ${(b.availableQuantity || 0).toLocaleString('vi-VN')} ${Utils.escapeHtml(product.unit || 'kg')} khả dụng</p>
                    ${b.qualityNotes ? `<p>${Utils.escapeHtml(b.qualityNotes)}</p>` : ''}
                  </div>
                  ${b.traceabilityUrl ? `
                    <a href="${b.traceabilityUrl}" target="_blank" rel="noreferrer">
                      Xem truy xuất <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
                    </a>
                  ` : ''}
                </article>
              `).join('')}
            </section>
          ` : ''}
        `;
      }

      if (currentTab === 'reviews') {
        const revs = reviews || [];
        return `
          <section>
            <h2>Đánh giá từ khách hàng</h2>
            <span class="mkt-rating">
              <span aria-hidden="true">★</span> <strong>${product.rating ? Number(product.rating).toFixed(1) : '5.0'}</strong>
              <small>(${product.reviewCount || 0} đánh giá)</small>
            </span>
            ${revs.length === 0 ? `
              <p style="margin-top: 14px;">Chưa có đánh giá từ khách hàng đã mua sản phẩm.</p>
            ` : `
              <p style="margin: 14px 0 20px; font-size: 13px; color: #536b5c;">Hiển thị ${revs.length} đánh giá mới nhất trong ${product.reviewCount || revs.length} đánh giá.</p>
              ${revs.map(r => `
                <article class="mkt-review">
                  <h3>${Utils.escapeHtml(r.author || 'Khách hàng')}</h3>
                  <span class="mkt-review-stars" aria-label="${r.rating} trên 5 sao">${'★'.repeat(r.rating || 5)}</span>
                  <span> · Đã mua hàng · ${r.date ? new Date(r.date).toLocaleDateString('vi-VN') : 'Gần đây'}</span>
                  <p>${Utils.escapeHtml(r.comment || 'Khách hàng đã đánh giá sản phẩm.')}</p>
                </article>
              `).join('')}
            `}
          </section>
        `;
      }

      if (currentTab === 'delivery') {
        return `
          <section>
            <h2>Chính sách giao hàng</h2>
            <p style="line-height: 1.6;">Phí vận chuyển và khả năng phục vụ phụ thuộc địa chỉ nhận hàng và được xác nhận khi thanh toán.</p>
            <p style="line-height: 1.6;">Kiểm tra thông tin lô hàng, hạn sử dụng và tổng tiền trước khi xác nhận đơn hàng.</p>
          </section>
        `;
      }
    }

    function selectTab(tabId) {
      currentTab = tabId;
      document.getElementById('tab-btn-information').setAttribute('aria-selected', tabId === 'information');
      document.getElementById('tab-btn-reviews').setAttribute('aria-selected', tabId === 'reviews');
      document.getElementById('tab-btn-delivery').setAttribute('aria-selected', tabId === 'delivery');
      document.getElementById('product-panel').innerHTML = renderTabContent();
    }

    function toggleFarmInfo() {
      showFarmDetails = !showFarmDetails;
      document.getElementById('farm-extra-panel').style.display = showFarmDetails ? 'block' : 'none';
      document.getElementById('btn-toggle-farm').innerHTML = `
        ${showFarmDetails ? 'Ẩn thông tin gian hàng' : 'Xem gian hàng'}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
      `;
    }

    function changeQuantity(delta) {
      quantity = Math.max(1, quantity + delta);
      document.getElementById('detail-qty').value = quantity;
    }

    function setQuantityVal(val) {
      quantity = Math.max(1, parseInt(val) || 1);
      document.getElementById('detail-qty').value = quantity;
    }

    async function handleAddToCart(e) {
      e.preventDefault();
      if (!Auth.isAuthenticated()) {
        Utils.showToast(Messages.common.loginRequiredAddToCart, 'warning');
        setTimeout(() => {
          window.location.href = '../Guest/login.html';
        }, 800);
        return;
      }
      const role = Auth.getUserRole();
      if (role && role !== 'RetailCustomer') {
        Utils.showToast(Messages.common.retailOnlyAddToCart, 'warning');
        return;
      }

      const btn = document.getElementById('btn-add-cart');
      btn.disabled = true;
      btn.textContent = 'Đang thêm…';

      try {
        const res = await API.addToCart(currentDetail.product.id, quantity, { suppressErrorToast: true });
        if (res.success) {
          const msg = (res.data?.messages && res.data.messages.length > 0)
            ? res.data.messages.join(' ')
            : `Đã thêm ${quantity} ${currentDetail.product.unit || 'sản phẩm'} vào giỏ hàng!`;
          Utils.showToast(msg, 'success');
          updateCartBadge();
        } else {
          Utils.showToast(res.error || Messages.cart.addFailed, 'error');
        }
      } catch (err) {
        Utils.showToast(err.message || Messages.common.networkError, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h3l3 12h11l3-9H6M9 21h.01M19 21h.01"/></svg>
          Thêm vào giỏ hàng
        `;
      }
    }

    async function handleShare() {
      const msgEl = document.getElementById('share-message');
      try {
        if (navigator.share) {
          await navigator.share({ title: currentDetail.product.name, url: window.location.href });
        } else {
          await navigator.clipboard.writeText(window.location.href);
          msgEl.textContent = 'Đã sao chép liên kết sản phẩm.';
          msgEl.style.display = 'block';
        }
      } catch (err) {
        msgEl.textContent = `Liên kết sản phẩm: ${window.location.href}`;
        msgEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
