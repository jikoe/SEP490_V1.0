<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng quan tài chính - AgriSustain</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/finance.css">
</head>
<body data-finance-page="dashboard">
  <div class="app-shell finance-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="workspace">
      <header id="app-header"></header>
      <main><section class="finance-page">
        <div id="finance-heading"></div>
        <div id="finance-filters"></div>
        <div id="finance-notice" class="notice error" role="alert" hidden></div>
        <div id="finance-content" aria-live="polite"><p role="status">Đang tải dữ liệu tài chính…</p></div>
        <div id="finance-source"></div>
      </section></main>
    </div>
  </div>
  <dialog id="finance-dialog" aria-labelledby="finance-dialog-title"><div class="modal-heading"><h2 id="finance-dialog-title"></h2><button type="button" id="finance-close-dialog" aria-label="Đóng">×</button></div><div id="finance-dialog-content"></div></dialog>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script type="module" src="../js/finance.js"></script>
</body>
</html>
