<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Chi trả cho nông dân - AgriSustain</title>
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/components.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar"></aside>
      <div class="workspace">
        <header id="app-header"></header>
        <main>
          <div id="business-root"></div>
        </main>
      </div>
    </div>
    <template id="business-template">
      <link href="../css/finance-farmer-payouts.css" rel="stylesheet">
      <main>
        <div class="page-title">
          <h1>Yêu cầu thanh toán của nông dân</h1>
          <p>Kiểm tra yêu cầu, xử lý chi trả và theo dõi kết quả chuyển khoản.</p>
        </div>
        <div class="screen-tabs" role="tablist" aria-label="Các trang chức năng">
          <button type="button" role="tab" data-screen-go="list" aria-controls="screen-list" id="tab-list">Danh sách yêu cầu</button>
          <button type="button" role="tab" data-screen-go="detail" aria-controls="screen-detail" id="tab-detail">Chi tiết / xử lý</button>
        </div>
        <div id="feedback" class="notice feedback" role="status" aria-live="polite" hidden="">
          <span id="feedbackText"></span>
        </div>
        <section class="screen" data-screen="list" id="screen-list" role="tabpanel" aria-labelledby="tab-list" hidden="">
          <section class="panel">
            <div class="body toolbar">
              <div class="field">
                <label for="payoutSearch">Tìm kiếm</label>
                <input id="payoutSearch" placeholder="Mã yêu cầu / phiếu chi / nông dân">
              </div>
              <div class="field">
                <label for="payoutFarmerFilter">Nông dân</label>
                <select id="payoutFarmerFilter"></select>
              </div>
              <div class="field">
                <label for="payoutStatusFilter">Trạng thái</label>
                <select id="payoutStatusFilter">
                  <option value="">Tất cả</option>
                  <option value="Pending">Chờ xử lý</option>
                  <option value="Processing">Đang xử lý</option>
                  <option value="NeedsReconciliation">Cần đối soát</option>
                  <option value="Processed">Đã thanh toán</option>
                  <option value="Rejected">Đã từ chối</option>
                  <option value="Failed">Thất bại đã xác minh</option>
                </select>
              </div>
              <div class="field">
                <label for="payoutFrom">Ngày gửi từ / đến</label>
                <div class="grid two">
                  <input id="payoutFrom" type="date" aria-label="Ngày gửi từ">
                  <input id="payoutTo" type="date" aria-label="Ngày gửi đến">
                </div>
              </div>
              <div class="actions">
                <button id="applyPayoutFilter" class="btn primary">Áp dụng</button>
                <button id="resetPayoutFilter" class="btn">Xóa lọc</button>
              </div>
            </div>
            <div class="panel-title">
              <h2>Danh sách yêu cầu thanh toán</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Yêu cầu / Ngày gửi</th>
                    <th>Nông dân</th>
                    <th class="amount">Tổng gộp</th>
                    <th class="amount">Hoa hồng / Khấu trừ</th>
                    <th class="amount">Thực trả</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="payoutRows"></tbody>
              </table>
            </div>
            <div id="payoutEmpty" class="empty" hidden>Không có kết quả tìm kiếm.</div>
            <div class="pagination">
              <span>
                <span id="payoutCount"></span>
              </span>
              <div>
                <button id="payoutPrev" class="btn">‹</button>
                <span id="payoutPage">1</span>
                <button id="payoutNext" class="btn">›</button>
              </div>
            </div>
          </section>
        </section>
        <section class="screen" data-screen="detail" id="screen-detail" role="tabpanel" aria-labelledby="tab-detail" hidden="">
          <div class="screen-back">
            <button class="btn" data-screen-go="list">← Danh sách yêu cầu</button>
            <h2>Chi tiết / xử lý</h2>
          </div>
          <section class="panel">
            <div class="panel-title">
              <h2>Yêu cầu ·<span id="payoutCode"></span>
              </h2>
              <span id="payoutBadge" class="badge"></span>
            </div>
            <div class="body grid two">
              <div>
                <h3>Nông dân gửi yêu cầu</h3>
                <dl id="savedPayoutDetails" class="kv"></dl>
              </div>
              <div class="summary">
                <h3>Tổng hợp yêu cầu</h3>
                <div class="line">
                  <span>Tổng gộp</span>
                  <strong id="savedGross"></strong>
                </div>
                <div class="line">
                  <span>Hoa hồng</span>
                  <strong id="savedFee"></strong>
                </div>
                <div class="line">
                  <span>Khấu trừ đã duyệt</span>
                  <strong id="savedDeduction"></strong>
                </div>
                <div class="line total">
                  <span>Thực trả</span>
                  <strong id="savedNet"></strong>
                </div>
              </div>
              <div class="wide notice">Chỉ thanh toán nguồn còn đủ điều kiện. Khoản đang có khiếu nại, hoàn tiền hoặc hạn giữ tài khoản không được chi trả.</div>
              <div class="wide">
                <h3>Tài khoản nhận tiền đã lưu</h3>
                <dl id="savedRecipient" class="kv"></dl>
              </div>
              <p class="wide muted">Thông tin và số tiền lấy từ yêu cầu của nông dân; không chỉnh sửa tại đây.</p>
            </div>
            <div class="panel-title">
              <h2>Nguồn đã được yêu cầu và giữ chỗ</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Nguồn / Tham chiếu</th>
                    <th>Điều kiện hiện tại</th>
                    <th class="amount">Tổng gộp</th>
                    <th class="amount">Hoa hồng</th>
                    <th class="amount">Khấu trừ</th>
                  </tr>
                </thead>
                <tbody id="sourceRows"></tbody>
              </table>
            </div>
            <div class="body grid two">
              <div class="wide notice">Yêu cầu đã gửi hoặc QR đã mở chưa có nghĩa là đã thanh toán. Chỉ ghi nhận sau khi xác minh giao dịch tiền ra phù hợp.</div>
              <div>
                <h3>Kết quả chuyển khoản</h3>
                <dl id="transferDetails" class="kv"></dl>
              </div>
              <div>
                <h3>Đối soát giao dịch</h3>
                <p id="reconciliationText"></p>
                <button id="checkGateway" class="btn">Kiểm tra kết quả chuyển tiền</button>
              </div>
              <div>
                <h3>Kết quả chưa hoàn tất</h3>
                <p id="failureText"></p>
              </div>
              <div>
                <h3>Thông báo kết quả</h3>
                <p id="payoutNotification"></p>
              </div>
              <div class="actions end wide">
                <button id="rejectRequest" class="btn danger">Từ chối yêu cầu</button>
                <button id="processPayout" class="btn primary">Mở QR chi trả</button>
              </div>
              <section id="qrPaymentBox" class="wide summary" hidden>
                <h3>Chuyển khoản cho nông dân</h3>
                <div class="qr-layout">
                  <div>
                    <img id="payoutQrImage" class="payout-qr" alt="Mã QR chuyển khoản cho nông dân">
                  </div>
                  <div>
                    <dl id="payoutQrDetails" class="kv"></dl>
                    <div class="actions end">
                      <button id="copyPayoutReference" class="btn">Sao chép nội dung chuyển khoản</button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
            <div class="panel-title">
              <h2>Trạng thái yêu cầu và lịch sử xử lý</h2>
            </div>
            <div class="body">
              <ul id="payoutHistory" class="history"></ul>
            </div>
          </section>
        </section>
      </main>
      <dialog id="confirmDialog">
        <h2>Xác nhận mở QR</h2>
        <p id="confirmText"></p>
        <div class="actions end">
          <button id="confirmCancel" class="btn">Quay lại</button>
          <button id="confirmOk" class="btn primary">Xác nhận</button>
        </div>
      </dialog>
      <dialog id="rejectDialog">
        <h2>Từ chối yêu cầu thanh toán</h2>
        <p>Yêu cầu chỉ được từ chối trước khi mở QR. Các khoản giữ cho yêu cầu này sẽ được giải phóng.</p>
        <label for="rejectReason">Lý do từ chối *</label>
        <textarea id="rejectReason" maxlength="500" placeholder="Nhập lý do từ chối, tối đa 500 ký tự"></textarea>
        <p id="rejectError" class="muted" role="alert"></p>
        <div class="actions end">
          <button class="btn" id="closeReject">Quay lại</button>
          <button class="btn danger" id="confirmReject">Xác nhận từ chối</button>
        </div>
      </dialog>
    </template>


    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../messages/common.js"></script>
    <script src="../messages/finance-payouts.js"></script>
    <script src="../messages/index.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/farmer-business.js"></script>
    <script src="../js/finance-farmer-payouts.js"></script>
  </body>
</html>
