<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Doanh thu và dòng tiền - AgriSustain</title>
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/components.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar"></aside>
      <div class="workspace">
        <header id="app-header"></header>
        <main>
          <div id="business-root"></div>
        </main>
      </div>
    </div>
    <template id="business-template">
      <link href="../css/farmer-revenue.css" rel="stylesheet">
      <main>
        <div class="page-title">
          <h1>Doanh thu và dòng tiền nông trại</h1>
          <p>Chọn trang chức năng hoặc mở chi tiết từ danh sách để tiếp tục.</p>
        </div>
        <div class="screen-tabs" role="tablist" aria-label="Các trang chức năng">
          <button type="button" role="tab" data-screen-go="dashboard" aria-controls="screen-dashboard" id="tab-dashboard">Tổng quan doanh thu</button>
          <button type="button" role="tab" data-screen-go="transactions" aria-controls="screen-transactions" id="tab-transactions">Lịch sử giao dịch</button>
          <button type="button" role="tab" data-screen-go="detail" aria-controls="screen-detail" id="tab-detail">Chi tiết giao dịch</button>
          <button type="button" role="tab" data-screen-go="requests" aria-controls="screen-requests" id="tab-requests">Yêu cầu thanh toán</button>
          <button type="button" role="tab" data-screen-go="request-create" aria-controls="screen-request-create" id="tab-request-create">Gửi yêu cầu</button>
          <button type="button" role="tab" data-screen-go="request-detail" aria-controls="screen-request-detail" id="tab-request-detail">Chi tiết yêu cầu</button>
        </div>
        <div id="feedback" class="notice feedback" role="status" aria-live="polite" hidden="">
          <span id="feedbackText"></span>
        </div>
        <section class="screen" data-screen="dashboard" id="screen-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" hidden="">
          <div class="actions dashboard-actions">
            <button class="btn" data-screen-go="transactions">Xem lịch sử giao dịch →</button>
            <button class="btn primary" data-screen-go="requests">Yêu cầu thanh toán</button>
          </div>
          <section class="panel">
            <div class="body toolbar revenue">
              <div class="field">
                <label for="revenueSeason">Mùa vụ</label>
                <select id="revenueSeason">
                  <option value="">Tất cả mùa vụ</option>
                </select>
              </div>
              <div class="field">
                <label>Kênh bán</label>
                <select id="revenueChannel">
                  <option value="">Tất cả</option>
                  <option value="B2C">B2C</option>
                  <option value="B2B">B2B</option>
                </select>
              </div>
              <div class="field">
                <label for="revenueFrom">Từ ngày</label>
                <input id="revenueFrom" type="date" required>
              </div>
              <div class="field">
                <label>Đến ngày</label>
                <input id="revenueTo" type="date" required>
              </div>
              <div class="field">
                <label for="revenueStage">Giai đoạn thanh toán</label>
                <select id="revenueStage">
                  <option value="">Tất cả</option>
                  <option value="Goods">Tiền hàng</option>
                  <option value="Deposit">Tiền cọc</option>
                  <option value="Milestone">Giao theo đợt</option>
                  <option value="Settlement">Quyết toán</option>
                </select>
              </div>
              <div class="field">
                <label>Trạng thái</label>
                <select id="revenueStatus">
                  <option value="">Tất cả</option>
                  <option value="Verified">Đã xác minh</option>
                  <option value="Held">Đang giữ</option>
                  <option value="Eligible">Đủ điều kiện</option>
                  <option value="Processed">Đã thực nhận</option>
                </select>
              </div>
              <div class="field">
                <label>Cơ sở ngày</label>
                <input readonly value="Ngày ghi nhận sự kiện tài chính">
              </div>
              <div class="actions">
                <button id="applyRevenue" class="btn primary">Áp dụng</button>
                <button id="resetRevenue" class="btn">30 ngày gần nhất</button>
              </div>
            </div>
          </section>
          <div class="metrics">
            <article class="metric">
              <p>Giá trị bán / thực hiện</p>
              <strong id="salesMetric">—</strong>
              <small>Khác với số tiền đã được chuyển</small>
            </article>
            <article class="metric">
              <p>Tiền người mua đã trả</p>
              <strong id="receiptsMetric">—</strong>
              <small>Chỉ khoản thu đã xác minh</small>
            </article>
            <article class="metric">
              <p>Tiền cọc đang giữ</p>
              <strong id="depositsMetric">—</strong>
              <small>Không cộng lại khi áp dụng quyết toán</small>
            </article>
            <article class="metric">
              <p>Hoa hồng</p>
              <strong id="commissionMetric">—</strong>
              <small>Tỷ lệ tại thời điểm phát sinh</small>
            </article>
            <article class="metric">
              <p>Điều chỉnh hoàn tiền</p>
              <strong id="refundMetric">—</strong>
              <small>Khoản đã hoàn được xác minh</small>
            </article>
            <article class="metric">
              <p>Đủ điều kiện chi trả</p>
              <strong id="eligibleMetric">—</strong>
              <small>Chưa phải tiền đã thực nhận</small>
            </article>
            <article class="metric">
              <p>Khoản đang giữ</p>
              <strong id="heldMetric">—</strong>
              <small>Theo lý do giữ của từng khoản</small>
            </article>
            <article class="metric">
              <p>Nông dân đã thực nhận</p>
              <strong id="payoutMetric">—</strong>
              <small>Chuyển khoản đã xác minh thành công</small>
            </article>
          </div>
          <section class="panel">
            <div class="panel-title">
              <h2>Doanh số, khoản thu và tiền thực nhận</h2>
              <small>VND · Theo cơ sở ngày đã chọn</small>
            </div>
            <div class="body">
              <svg id="revenueChart" class="chart" viewbox="0 0 1000 210" role="img" aria-label="Biểu đồ doanh số, khoản thu và thực nhận theo kênh"></svg>
              <div class="legend">
                <span><i class="local-style-0"></i>Giá trị bán</span>
                <span><i class="local-style-1"></i>Thu đã xác minh</span>
                <span><i class="local-style-2"></i>Thực nhận</span>
              </div>
            </div>
          </section>
          <p class="muted">Chỉ truy cập lịch sử tài chính và yêu cầu thanh toán của nông trại mình. Xem và xuất báo cáo không thay đổi dữ liệu tài chính. Các số liệu theo từng giai đoạn không được cộng thành một số dư chung. Thời gian Việt Nam · Tiền tệ VND.</p>
        </section>
        <section class="screen" data-screen="transactions" id="screen-transactions" role="tabpanel" aria-labelledby="tab-transactions" hidden="">
          <div class="screen-back">
            <button type="button" class="btn" data-screen-go="dashboard">← Tổng quan doanh thu</button>
            <h2>Lịch sử giao dịch</h2>
          </div>
          <section class="panel">
            <div class="body toolbar revenue">
              <div class="field">
                <label for="historySeason">Mùa vụ</label>
                <select id="historySeason">
                  <option value="">Tất cả mùa vụ</option>
                </select>
              </div>
              <div class="field">
                <label>Kênh bán</label>
                <select id="historyChannel">
                  <option value="">Tất cả</option>
                  <option value="B2C">B2C</option>
                  <option value="B2B">B2B</option>
                </select>
              </div>
              <div class="field">
                <label for="historyFrom">Từ ngày</label>
                <input id="historyFrom" type="date" required>
              </div>
              <div class="field">
                <label>Đến ngày</label>
                <input id="historyTo" type="date" required>
              </div>
              <div class="field">
                <label for="historyStage">Giai đoạn thanh toán</label>
                <select id="historyStage">
                  <option value="">Tất cả</option>
                  <option value="Goods">Tiền hàng</option>
                  <option value="Deposit">Tiền cọc</option>
                  <option value="Milestone">Giao theo đợt</option>
                  <option value="Settlement">Quyết toán</option>
                </select>
              </div>
              <div class="field">
                <label>Trạng thái</label>
                <select id="historyStatus">
                  <option value="">Tất cả</option>
                  <option value="Verified">Đã xác minh</option>
                  <option value="Held">Đang giữ</option>
                  <option value="Eligible">Đủ điều kiện</option>
                  <option value="Processed">Đã thực nhận</option>
                </select>
              </div>
              <div class="field">
                <label>Cơ sở ngày</label>
                <input readonly value="Ngày ghi nhận sự kiện tài chính">
              </div>
              <div class="actions">
                <button id="applyHistory" class="btn primary">Áp dụng</button>
                <button id="resetHistory" class="btn">30 ngày gần nhất</button>
              </div>
            </div>
          </section>
          <div class="notice">
            <span id="appliedFilterLabel">Dữ liệu theo bộ lọc đã áp dụng.</span>
          </div>
          <section class="panel">
            <div class="panel-title">
              <h2>Lịch sử tài chính</h2>
              <div class="actions">
                <button class="btn" data-screen-go="requests">Yêu cầu thanh toán</button>
                <select id="exportFormat" aria-label="Định dạng xuất" style="width:110px">
                  <option value="xlsx">Excel</option>
                  <option value="csv">CSV</option>
                </select>
                <button id="exportRevenue" class="btn primary">Xuất báo cáo</button>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Tham chiếu / Ngày</th>
                    <th>Nguồn / Mùa vụ</th>
                    <th>Kênh / Giai đoạn</th>
                    <th class="amount">Giá trị sự kiện</th>
                    <th class="amount">Hoa hồng / Hoàn</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="revenueRows"></tbody>
              </table>
            </div>
            <div id="revenueEmpty" class="empty" hidden>Không tìm thấy dữ liệu doanh thu theo điều kiện đã chọn.</div>
            <div class="pagination">
              <span id="revenueCount"></span>
              <div>
                <button class="btn" id="revenuePrev">‹</button>
                <span id="revenuePage">1</span>
                <button class="btn" id="revenueNext">›</button>
              </div>
            </div>
          </section>
        </section>
        <section class="screen" data-screen="detail" id="screen-detail" role="tabpanel" aria-labelledby="tab-detail" hidden="">
          <div class="screen-back">
            <button type="button" class="btn" data-screen-go="transactions">← Lịch sử giao dịch</button>
            <h2>Chi tiết giao dịch</h2>
          </div>
          <section class="panel">
            <div class="panel-title">
              <h2>Chi tiết giao dịch / khoản chi trả</h2>
            </div>
            <div class="body">
              <dl id="revenueDetail" class="kv"></dl>
            </div>
          </section>
        </section>
        <section class="screen" data-screen="requests" id="screen-requests" role="tabpanel" aria-labelledby="tab-requests" hidden="">
          <div class="screen-back">
            <button class="btn" data-screen-go="dashboard">← Tổng quan doanh thu</button>
            <button class="btn primary" data-screen-go="request-create">+ Gửi yêu cầu thanh toán</button>
          </div>
          <section class="panel">
            <div class="panel-title">
              <h2>Yêu cầu thanh toán của tôi</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Mã yêu cầu / Ngày gửi</th>
                    <th class="amount">Thực nhận dự kiến</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="requestRows"></tbody>
              </table>
            </div>
            <div class="pagination">
              <span id="requestCount"></span>
              <div>
                <button class="btn" id="requestPrev">‹</button>
                <span id="requestPage">1</span>
                <button class="btn" id="requestNext">›</button>
              </div>
            </div>
          </section>
        </section>
        <section class="screen" data-screen="request-create" id="screen-request-create" role="tabpanel" aria-labelledby="tab-request-create" hidden="">
          <div class="screen-back">
            <button class="btn" data-screen-go="requests">← Yêu cầu thanh toán</button>
            <h2>Gửi yêu cầu thanh toán</h2>
          </div>
          <section class="panel">
            <div class="panel-title">
              <h2>Tài khoản nhận tiền đã lưu</h2>
              <span class="badge" id="requestBankState"></span>
            </div>
            <div class="body">
              <dl id="requestRecipient" class="kv"></dl>
            </div>
          </section>
          <section class="panel">
            <div class="panel-title">
              <h2>Chọn khoản đủ điều kiện thanh toán</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Chọn</th>
                    <th>Nguồn / Kênh bán</th>
                    <th>Điều kiện</th>
                    <th class="amount">Tổng gộp</th>
                    <th class="amount">Hoa hồng</th>
                    <th class="amount">Khấu trừ</th>
                    <th class="amount">Có thể yêu cầu</th>
                  </tr>
                </thead>
                <tbody id="requestSourceRows"></tbody>
              </table>
            </div>
            <div class="body grid two">
              <p class="muted">Chỉ chọn khoản đã đủ điều kiện và chưa được yêu cầu hoặc chi trả. Khoản đang giữ được hiển thị cùng lý do.</p>
              <div class="summary">
                <h3>Tổng hợp yêu cầu</h3>
                <div class="line">
                  <span>Số nguồn đã chọn</span>
                  <strong id="requestSourceCount">0</strong>
                </div>
                <div class="line">
                  <span>Tổng gộp</span>
                  <strong id="requestGross">0 ₫</strong>
                </div>
                <div class="line">
                  <span>Hoa hồng</span>
                  <strong id="requestFee">0 ₫</strong>
                </div>
                <div class="line">
                  <span>Khấu trừ đã duyệt</span>
                  <strong id="requestDeduction">0 ₫</strong>
                </div>
                <div class="line total">
                  <span>Số tiền yêu cầu</span>
                  <strong id="requestNet">0 ₫</strong>
                </div>
              </div>
              <div class="actions end wide">
                <button class="btn" id="discardRequest">Hủy nhập</button>
                <button class="btn primary" id="submitRequest" disabled>Gửi yêu cầu thanh toán</button>
              </div>
            </div>
          </section>
        </section>
        <section class="screen" data-screen="request-detail" id="screen-request-detail" role="tabpanel" aria-labelledby="tab-request-detail" hidden="">
          <div class="screen-back">
            <button class="btn" data-screen-go="requests">← Yêu cầu thanh toán</button>
            <h2>Chi tiết yêu cầu</h2>
          </div>
          <section class="panel">
            <div class="panel-title">
              <h2>
                <span id="requestDetailCode"></span>
              </h2>
              <span class="badge" id="requestDetailState"></span>
            </div>
            <div class="body grid two">
              <dl class="kv" id="requestDetails"></dl>
              <div class="summary" id="requestDetailSummary"></div>
            </div>
            <div class="panel-title">
              <h2>Lịch sử xử lý</h2>
            </div>
            <div class="body">
              <ul class="history" id="requestHistory"></ul>
            </div>
          </section>
        </section>
      </main>
      <dialog id="confirmDialog">
        <h2>Xác nhận thao tác</h2>
        <p id="confirmText"></p>
        <div class="actions end">
          <button id="confirmCancel" class="btn" type="button">Quay lại</button>
          <button id="confirmOk" class="btn primary" type="button">Xác nhận</button>
        </div>
      </dialog>
    </template>


    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../messages/common.js"></script>
    <script src="../messages/farmer-business.js"></script>
    <script src="../messages/finance-payouts.js"></script>
    <script src="../messages/index.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/farmer-business.js"></script>
    <script src="../js/farmer-payment-requests.js"></script>
    <script src="../js/farmer-revenue.js"></script>
  </body>
</html>
