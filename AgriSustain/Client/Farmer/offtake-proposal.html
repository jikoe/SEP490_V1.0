<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đề xuất hợp đồng Offtake - AgriSustain</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/offtake.css">
</head>
<body class="offtake">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="workspace">
      <header id="app-header"></header>
      <main class="offtake-main">
        <h1>Đề xuất hợp đồng Offtake</h1>
        <p id="farmer-proposal-notice" class="offtake-notice" role="status" hidden></p>
        <section class="panel offtake-card" id="farmer-proposal-detail" hidden></section>
        <p id="farmer-proposal-actions" hidden><a class="offtake-button" id="farmer-proposal-contract">Mở hợp đồng để phản hồi</a></p>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/components.js"></script>
  <script type="module" src="../js/farmer-offtake-proposal.js"></script>
</body>
</html>
