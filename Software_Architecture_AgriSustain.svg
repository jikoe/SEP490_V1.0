<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">AgriSustain software architecture</title>
  <desc id="desc">Layered architecture for the AgriSustain responsive web platform, showing React client, ASP.NET Core Web API clean architecture, SQL Server, PayOS VietQR, and Gmail.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.tier{font-size:16px;font-weight:700}.heading{font-size:15px;font-weight:700}.label{font-size:13px;font-weight:600}.small{font-size:12px}.tiny{font-size:11px;fill:#475569}.box{stroke-width:1.6}.line{fill:none;stroke:#486581;stroke-width:2.1;marker-end:url(#arrow)}.dash{fill:none;stroke:#7b61a8;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#arrowPurple)}.greenline{fill:none;stroke:#40836a;stroke-width:2;marker-end:url(#arrowGreen)}.back{fill:none;stroke:#c05f4a;stroke-width:2;marker-end:url(#arrowOrange)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#486581"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7b61a8"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#40836a"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c05f4a"/></marker>
  </defs>

  <rect width="1600" height="1050" fill="#ffffff"/>
  <text x="800" y="38" text-anchor="middle" class="title">SOFTWARE ARCHITECTURE - AGRISUSTAIN</text>
  <text x="800" y="61" text-anchor="middle" class="small" fill="#475569">Responsive B2B &amp; B2C agricultural marketplace, traceability, payment and operational reporting</text>

  <!-- Client tier -->
  <rect x="35" y="88" width="1530" height="162" rx="8" fill="#eaf3ff" stroke="#76a7dd" stroke-width="1.8"/>
  <text x="800" y="113" text-anchor="middle" class="tier">Client Tier - Browser-based Responsive Web Application</text>
  <rect x="65" y="128" width="1470" height="100" rx="12" fill="#f8fbff" stroke="#76a7dd" class="box"/>
  <text x="800" y="151" text-anchor="middle" class="heading">React 19.1.0 Frontend with Tailwind CSS</text>
  <rect x="105" y="169" width="185" height="38" rx="7" fill="#dcecff" stroke="#76a7dd" class="box"/><text x="197" y="193" text-anchor="middle" class="label">Pages &amp; Routing</text>
  <rect x="322" y="169" width="185" height="38" rx="7" fill="#dcecff" stroke="#76a7dd" class="box"/><text x="414" y="193" text-anchor="middle" class="label">Reusable Components</text>
  <rect x="539" y="169" width="185" height="38" rx="7" fill="#dcecff" stroke="#76a7dd" class="box"/><text x="631" y="193" text-anchor="middle" class="label">State &amp; API Client</text>
  <rect x="756" y="169" width="185" height="38" rx="7" fill="#dcecff" stroke="#76a7dd" class="box"/><text x="848" y="193" text-anchor="middle" class="label">Role-based UI</text>
  <rect x="973" y="169" width="220" height="38" rx="7" fill="#dcecff" stroke="#76a7dd" class="box"/><text x="1083" y="193" text-anchor="middle" class="label">Marketplace / QR Views</text>
  <rect x="1225" y="169" width="270" height="38" rx="7" fill="#dcecff" stroke="#76a7dd" class="box"/><text x="1360" y="193" text-anchor="middle" class="label">Consumer, Farmer, B2B, Admin</text>

  <!-- Application tier -->
  <rect x="35" y="285" width="1080" height="630" rx="8" fill="#f6fbf8" stroke="#7cb896" stroke-width="1.8"/>
  <text x="575" y="311" text-anchor="middle" class="tier">Application Tier - ASP.NET Core 8 Web API / Clean Architecture</text>
  <rect x="65" y="332" width="1020" height="86" rx="9" fill="#fff4d6" stroke="#d7a63b" class="box"/>
  <text x="575" y="358" text-anchor="middle" class="heading">Presentation &amp; Security</text>
  <rect x="96" y="371" width="210" height="28" rx="5" fill="#fffdf4" stroke="#d7a63b" class="box"/><text x="201" y="390" text-anchor="middle" class="small">REST API Controllers / DTOs</text>
  <rect x="356" y="371" width="190" height="28" rx="5" fill="#fffdf4" stroke="#d7a63b" class="box"/><text x="451" y="390" text-anchor="middle" class="small">JWT Authentication</text>
  <rect x="596" y="371" width="190" height="28" rx="5" fill="#fffdf4" stroke="#d7a63b" class="box"/><text x="691" y="390" text-anchor="middle" class="small">RBAC Authorization</text>
  <rect x="836" y="371" width="215" height="28" rx="5" fill="#fffdf4" stroke="#d7a63b" class="box"/><text x="943" y="390" text-anchor="middle" class="small">Validation &amp; Error Handling</text>

  <rect x="65" y="442" width="1020" height="220" rx="9" fill="#e8f7ed" stroke="#55a878" class="box"/>
  <text x="575" y="468" text-anchor="middle" class="heading">Application Layer - Use Cases and Business Workflows</text>
  <rect x="92" y="492" width="205" height="56" rx="7" fill="#ffffff" stroke="#55a878" class="box"/><text x="194" y="514" text-anchor="middle" class="label">Account &amp; Access</text><text x="194" y="533" text-anchor="middle" class="tiny">OTP, profile, role control</text>
  <rect x="325" y="492" width="205" height="56" rx="7" fill="#ffffff" stroke="#55a878" class="box"/><text x="427" y="514" text-anchor="middle" class="label">Marketplace &amp; Catalog</text><text x="427" y="533" text-anchor="middle" class="tiny">search, products, batches</text>
  <rect x="558" y="492" width="205" height="56" rx="7" fill="#ffffff" stroke="#55a878" class="box"/><text x="660" y="514" text-anchor="middle" class="label">Ordering &amp; Payment</text><text x="660" y="533" text-anchor="middle" class="tiny">cart, checkout, transactions</text>
  <rect x="791" y="492" width="265" height="56" rx="7" fill="#ffffff" stroke="#55a878" class="box"/><text x="923" y="514" text-anchor="middle" class="label">Traceability &amp; Farm Data</text><text x="923" y="533" text-anchor="middle" class="tiny">QR code, crop season, farming logs</text>
  <rect x="210" y="574" width="235" height="56" rx="7" fill="#ffffff" stroke="#55a878" class="box"/><text x="327" y="596" text-anchor="middle" class="label">B2B Offtake Contracts</text><text x="327" y="615" text-anchor="middle" class="tiny">proposal, milestones, subscription</text>
  <rect x="475" y="574" width="235" height="56" rx="7" fill="#ffffff" stroke="#55a878" class="box"/><text x="592" y="596" text-anchor="middle" class="label">Administration &amp; Reports</text><text x="592" y="615" text-anchor="middle" class="tiny">moderation, complaints, analytics</text>
  <rect x="740" y="574" width="235" height="56" rx="7" fill="#ffffff" stroke="#55a878" class="box"/><text x="857" y="596" text-anchor="middle" class="label">Notifications</text><text x="857" y="615" text-anchor="middle" class="tiny">in-app messages and email requests</text>

  <rect x="65" y="687" width="1020" height="94" rx="9" fill="#f0ecfa" stroke="#8a71b6" class="box"/>
  <text x="575" y="713" text-anchor="middle" class="heading">Domain Layer - Core Rules and Entities</text>
  <text x="575" y="740" text-anchor="middle" class="small">Accounts · Products · Product Batches · Crop Seasons · Farming Logs · Orders · Financial Transactions · Offtake Contracts</text>
  <text x="575" y="761" text-anchor="middle" class="small">Certifications · Reviews · Complaints · Notifications · Audit Rules · Inventory Reservation and Payment-State Rules</text>

  <rect x="65" y="806" width="1020" height="82" rx="9" fill="#e9f0ff" stroke="#698ed0" class="box"/>
  <text x="575" y="832" text-anchor="middle" class="heading">Infrastructure Layer</text>
  <text x="575" y="857" text-anchor="middle" class="small">EF Core Repositories · Integration Adapters · Background Jobs (expiry, payment reconciliation, notification retry) · Logging / Audit</text>

  <!-- external services -->
  <rect x="1145" y="285" width="420" height="630" rx="8" fill="#fffafa" stroke="#bd9d9a" stroke-width="1.8"/>
  <text x="1355" y="311" text-anchor="middle" class="tier">External Systems</text>
  <rect x="1185" y="348" width="340" height="125" rx="10" fill="#fff0dc" stroke="#d4863b" class="box"/>
  <text x="1355" y="377" text-anchor="middle" class="heading">PayOS / VietQR Payment Gateway</text>
  <text x="1355" y="402" text-anchor="middle" class="small">Dynamic payment QR / transaction status API</text>
  <text x="1355" y="425" text-anchor="middle" class="small">Inbound IPN webhook: /payments/webhook/payos</text>
  <text x="1355" y="448" text-anchor="middle" class="tiny">Transitions order to Paid and records transaction history</text>
  <rect x="1185" y="545" width="340" height="110" rx="10" fill="#edf6ff" stroke="#6699cc" class="box"/>
  <text x="1355" y="576" text-anchor="middle" class="heading">Google Gmail API</text>
  <text x="1355" y="601" text-anchor="middle" class="small">OTP verification, password reset and alerts</text>
  <text x="1355" y="624" text-anchor="middle" class="small">Order / contract notification email</text>
  <rect x="1185" y="727" width="340" height="105" rx="10" fill="#f7f7f7" stroke="#8993a4" class="box"/>
  <text x="1355" y="756" text-anchor="middle" class="heading">Users in Web Browsers</text>
  <text x="1355" y="781" text-anchor="middle" class="small">Guest · Consumer · Farmer · B2B Buyer · Administrator</text>
  <text x="1355" y="805" text-anchor="middle" class="tiny">Responsive desktop, tablet and mobile browser access</text>

  <!-- Data tier -->
  <rect x="35" y="943" width="1080" height="78" rx="8" fill="#fff7de" stroke="#d7a63b" stroke-width="1.8"/>
  <text x="575" y="968" text-anchor="middle" class="tier">Data Tier</text>
  <ellipse cx="245" cy="990" rx="104" ry="20" fill="#fff0c1" stroke="#d7a63b" class="box"/><rect x="141" y="976" width="208" height="17" fill="#fff0c1" stroke="#d7a63b" class="box"/><text x="245" y="994" text-anchor="middle" class="label">Microsoft SQL Server</text>
  <text x="705" y="993" text-anchor="middle" class="small">Relational data accessed through EF Core</text>

  <!-- Relationship lines -->
  <path class="line" d="M 1355 727 L 1355 252 L 575 252 L 575 332"/>
  <text x="955" y="244" text-anchor="middle" class="small" fill="#486581">HTTPS / REST JSON requests and responses</text>
  <path class="line" d="M 660 418 L 660 491"/>
  <text x="690" y="458" class="tiny">delegates to</text>
  <path class="line" d="M 575 662 L 575 687"/>
  <path class="line" d="M 575 781 L 575 806"/>
  <path class="line" d="M 245 888 L 245 969"/>
  <text x="278" y="929" class="tiny">EF Core / SQL</text>
  <path class="greenline" d="M 1085 523 L 1185 410"/>
  <text x="1090" y="454" class="tiny">create QR / query status</text>
  <path class="back" d="M 1185 439 L 1085 579"/>
  <text x="1096" y="575" class="tiny">validated webhook (IPN)</text>
  <path class="greenline" d="M 1085 601 L 1185 601"/>
  <text x="1135" y="589" text-anchor="middle" class="tiny">send email (HTTPS)</text>
  <path class="dash" d="M 975 847 L 1130 847 L 1130 695 L 1185 695"/>
  <text x="1122" y="681" text-anchor="middle" class="tiny">scheduled jobs</text>

  <text x="35" y="1042" class="tiny">Scope note: native mobile apps, dedicated logistics/GPS fleets, IoT field sensors and blockchain nodes are outside the current capstone scope.</text>
</svg>
